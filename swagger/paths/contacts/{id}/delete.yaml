tags:
  - Contacts
summary: Delete contact by Id
operationId: deleteContact
description: Permanently removes the contact with the specified ID if it belongs to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65e4decdd286b30065d54af9'
    description: The unique identifier of the contact
responses:
  '204':
    description: Contact deleted successfully. No response body is returned.
  '404':
    $ref: ../../../components/responses/404.yaml
