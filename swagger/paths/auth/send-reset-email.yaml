tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../components/schemas/requestReset.yaml
responses:
  '200':
    description: Email sent if user exists
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset email sent if user exists
  '400':
    $ref: ../../components/responses/400.yaml
