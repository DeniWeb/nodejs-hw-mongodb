tags:
  - Auth
summary: Register a new user
operationId: registerUser
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../components/schemas/register.yaml
responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/userResponse.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '409':
    description: Email in use
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: Email in use
