type: object
required:
  - _id
  - name
  - email
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    example: '64fbd30c9c8f254321a4abcd'
  name:
    type: string
    example: 'Denis'
  email:
    type: string
    format: email
    example: 'denis.it@gmail.com'
  createdAt:
    type: string
    format: date-time
    example: '2025-07-17T10:00:00.000Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-07-17T10:00:00.000Z'
