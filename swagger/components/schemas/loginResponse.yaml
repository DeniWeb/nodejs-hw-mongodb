type: object
properties:
  status:
    type: integer
    example: 200
  message:
    type: string
    example: 'Successfully logged in an user!'
  data:
    type: object
    required:
      - accessToken
    properties:
      accessToken:
        type: string
        example: '36EyzLF9+RMdk/NqxVYj6621VJpvM+DR+X71Vv1E'
