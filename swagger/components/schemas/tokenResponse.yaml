type: object
properties:
  status:
    type: integer
    example: 200
  message:
    type: string
    example: 'Successfully refreshed a session!'
  data:
    type: object
    required:
      - accessToken
    properties:
      accessToken:
        type: string
        example: 'ypENE+9fBd5oj9nmHIXcsXNrVfZK3ZF7AsIMiH8j'
